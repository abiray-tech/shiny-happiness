<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>fFACEBOOK</title>
        <link rel="stylesheet" href="face.css">
    </head>
    <body>
        <h2 class="head">Facebook</h2>
        <p class="head1">Connect with friends and the world around you.</p>
        <form class="main">
            <div class="new">
                Creat a new account
            </div>
            <p>It's quick and easy.</p>
            <hr>
            <input type="text" id="first name" placeholder="First name">
            <input type="text" id="last name" placeholder="Last name">
            <input class="number" type="text" id="number" placeholder="Mobile number or email address">
            <input class="password" type="password" id="password" placeholder="New password">
            <p>Birthday</p>
            <input class="date" type="date" id="date" placeholder="mm/dd/yyyy">
            <p>Gender</p>
            <div class="rad">
            <button>
                <input type="radio" id="female"> Female
            </button>
            <button>
                <input type="radio" id="male"> Male
            </button>
            <button>
                <input type="radio" id="custom"> Custom
            </button>
            </div>
            <p class="click">by clicking Sign Up, you agree to our Terms, Privacy Policy and Cookies Policy.</p>
            <button class="up">Sign Up</button>
            <p class="final">Already have an account?</p>
        </form>
    </body>
</html>
